{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">Painel de Administração</h2>
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Gerenciamento de Usuários</h5>
            </div>
            <div class="card-body">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuário</th>
                            <th>Papel Atual</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td>{{ user.username }}</td>
                            <td>
                                <span class="badge {% if user.role == 'admin' %}bg-danger{% elif user.role == 'org' %}bg-primary{% else %}bg-secondary{% endif %}">
                                    {{ user.role | upper }}
                                </span>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
