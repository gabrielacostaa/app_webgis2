{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-dark-slate text-white p-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; font-size: 1.3rem;">
                            <i class="bi bi-key-fill"></i>
                        </div>
                        <div>
                            <h5 class="mb-0 fw-bold">Alterar Minha Senha de Acesso</h5>
                            <small class="text-light opacity-75">Atualização de Segurança do Agente / Usuário</small>
                        </div>
                    </div>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('change_password') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Senha Atual <span class="text-danger">*</span></label>
                            <input type="password" name="current_password" class="form-control rounded-3" placeholder="Sua senha atual" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Nova Senha <span class="text-danger">*</span></label>
                            <input type="password" name="new_password" class="form-control rounded-3" placeholder="Digite a nova senha" required minlength="4">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small">Confirmar Nova Senha <span class="text-danger">*</span></label>
                            <input type="password" name="confirm_password" class="form-control rounded-3" placeholder="Repita a nova senha" required minlength="4">
                        </div>
                        <div class="d-flex justify-content-between align-items-center border-top pt-3">
                            <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary rounded-pill px-3">Cancelar</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                                <i class="bi bi-check-lg me-1"></i> Salvar Nova Senha
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
